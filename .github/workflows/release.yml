name: Release

# Publishes all public @ai-gui/* packages to npm when a version tag (vX.Y.Z) is pushed.
# The npm token is read from the NPM_TOKEN repository secret — never hardcoded.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release, after the packages are out
      id-token: write # enables npm provenance on public repos
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate:release-tag

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test:unit

      # Fails below the 75% thresholds set in vitest.config.ts.
      - run: pnpm test:coverage

      - run: pnpm validate:packages

      # Real-browser drawing, so a release cannot ship a 3D block that renders blank.
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - run: pnpm --filter @ai-gui/image exec playwright install --with-deps --only-shell chromium

      - run: pnpm test:browser

      # Publishes every workspace package whose version is not yet on the registry.
      # pnpm skips packages already published at their current version.
      - run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The GitHub release: what changed, gathered from every package's changelog, and how to
      # install it. Watchers are notified; npm is the source of the packages either way.
      - run: |
          node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      # The MCP Registry, which MCP clients search. It verifies the npm package by its `mcpName`
      # and this repository by GitHub's OIDC token — no secret. The registry is in preview, so a
      # failure here is reported but does not fail a release whose packages are already out.
      # The registry looks the version up on npm, which can lag a fresh publish by many minutes,
      # so it waits for npm to serve it first.
      - name: Publish to the MCP Registry
        continue-on-error: true
        timeout-minutes: 45
        run: |
          version="${GITHUB_REF_NAME#v}"
          until npm view "@ai-gui/mcp@${version}" version >/dev/null 2>&1; do sleep 30; done
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 60; done
          exit 1
